name: Build RTL8812AU for NetHunter

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'GKI Manifest Branch'
        required: true
        default: 'common-android16-6.12-lts'

jobs:
  build-driver:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Create Manual 16GB Swap File
        run: |
          echo "=== Freeing up any existing partial swap ==="
          sudo swapoff -a
          if [ -f /swapfile ]; then sudo rm -f /swapfile; fi

          echo "=== Allocating 16GB Swap ==="
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "=== Verified Memory Configuration ==="
          free -h

      - name: Checkout OOT Repo
        uses: actions/checkout@v4

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync GKI Kernel Workspace
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b ${{ inputs.manifest_branch }} --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc)

      - name: Clone & Patch morrownr/8812au
        run: |
          cd kernel_workspace
          git clone --depth 1 https://github.com/morrownr/8812au-20210820.git 8812au
          
          # 1. Architecture Setup
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' 8812au/Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/g' 8812au/Makefile
          
          # 2. Strip GCC-specific flags that crash Android's Clang compiler
          sed -i 's/-Wno-enum-int-mismatch//g' 8812au/Makefile
          sed -i 's/-Wno-stringop-overread//g' 8812au/Makefile
          
          # 3. Prevent driver from hijacking the build path to the Ubuntu Host
          sed -i 's|KSRC ?= /lib/modules/$(shell uname -r)/build|KSRC := $(OUT_DIR)|g' 8812au/Makefile

      - name: Create Kleaf BUILD.bazel
        run: |
          cat << 'EOF' > kernel_workspace/8812au/BUILD.bazel
          load("//build/kernel/kleaf:kernel.bzl", "kernel_module")
          
          kernel_module(
              name = "8812au",
              srcs = glob(["**/*"], exclude=["**/*.ko", "**/*.o", ".git/**"]),
              outs = ["8812au.ko"],
              kernel_build = "//common:kernel_aarch64",
              make_args = [
                  "KSRC=$(OUT_DIR)",
                  "KDIR=$(OUT_DIR)",
              ],
          )
          EOF

      - name: Compile 8812AU via Bazel
        run: |
          cd kernel_workspace
          tools/bazel build //8812au:8812au

      - name: Stage & Upload Artifact
        run: |
          mkdir -p out_module
          find kernel_workspace/bazel-bin/8812au -name "8812au.ko" -exec cp {} out_module/ \;
          
      - name: Upload 8812AU Module
        uses: actions/upload-artifact@v4
        with:
          name: 8812au-Android-GKI
          path: out_module/8812au.ko
