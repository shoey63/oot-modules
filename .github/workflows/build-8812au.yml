name: Build RTL8812AU for NetHunter

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'GKI Manifest Branch'
        required: true
        default: 'common-android16-6.12-lts'

jobs:
  build-driver:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync GKI Kernel Workspace
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b ${{ inputs.manifest_branch }} --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc)

      - name: Ephemeral In-Tree Injection
        run: |
          cd kernel_workspace/common
          
          # 1. Grab the fixed source
          git clone https://github.com/shoey63/Kernel-Builder-GKI-Susfs.git /tmp/gki-builder
          cd /tmp/gki-builder
          git checkout 3b648af7c3c184645fe3545b8043e938b3d31c9e
          
          # 2. Copy the driver using its ORIGINAL folder name (rtl8812au)
          cd $GITHUB_WORKSPACE/kernel_workspace/common
          cp -r /tmp/gki-builder/tools/user_source/drivers/net/wireless/realtek/rtl8812au drivers/net/wireless/realtek/rtl8812au
          
          cd drivers/net/wireless/realtek/rtl8812au
          
          # 3. THE FIX: Set the exact variable your Makefile expects!
          sed -i '1s/^/CONFIG_88XXAU := m\n/' Makefile
          
          # 4. Wire it into the Realtek Makefile using the correct name
          echo 'obj-m += rtl8812au/' >> ../Makefile
          
          # 5. Force the main wireless Makefile to enter the Realtek folder
          echo 'obj-y += realtek/' >> ../../Makefile

      - name: Register Module with Bazel
        run: |
          cd kernel_workspace
          
          # Tell Bazel to expect 88XXau.ko inside the rtl8812au folder
          sed -i '/_COMMON_GKI_MODULES_LIST = \[/a \    "drivers/net/wireless/realtek/rtl8812au/88XXau.ko",' common/modules.bzl

      - name: Compile 8812AU
        run: |
          cd kernel_workspace
          tools/bazel build //common:kernel_aarch64
          
      - name: Stage & Upload Artifact
        run: |
          mkdir -p out_module
          find kernel_workspace/out -name "88XXau.ko" -exec cp {} out_module/8812au.ko \;
