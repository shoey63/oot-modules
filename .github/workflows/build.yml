name: Build Wi-Fi Module

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Driver Source
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev clang lld llvm gcc-aarch64-linux-gnu libelf-dev libdw-dev zlib1g-dev pkg-config dwarves

      - name: Checkout Official GKI Kernel
        run: |
          # Use a blobless clone to bypass server restrictions while skipping gigabytes of unneeded history
          git clone --filter=blob:none https://android.googlesource.com/kernel/common.git
          cd common
          git checkout 956bb2204e5f

      - name: Compile Full Kernel (Generates Module.symvers)
        run: |
          cd common
          make ARCH=arm64 LLVM=1 gki_defconfig
          
          # Force enable wireless subsystems, rfkill, and legacy WEXT
          ./scripts/config --module CONFIG_CFG80211
          ./scripts/config --module CONFIG_MAC80211
          ./scripts/config --module CONFIG_RFKILL
          ./scripts/config --enable CONFIG_CFG80211_WEXT
          ./scripts/config --enable CONFIG_WIRELESS_EXT
          ./scripts/config --enable CONFIG_WEXT_CORE
          ./scripts/config --enable CONFIG_WEXT_PRIV
          make ARCH=arm64 LLVM=1 olddefconfig
          
          # Explicitly build modules to ensure they are added to Module.symvers
          make ARCH=arm64 LLVM=1 -j$(nproc) all modules

      - name: Compile Wi-Fi Module
        run: |
          cd driver
          make ARCH=arm64 LLVM=1 M=$PWD -C ../common modules
          llvm-strip --strip-debug 88XXau.ko

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 88XXau-module
          path: driver/88XXau.ko
